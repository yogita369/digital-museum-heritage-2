# CI/CD for the Digital Museum and Heritage Information System.
#
#   pull request to main  -> test + terraform plan for dev and prod (nothing is changed)
#   push to main          -> test + terraform apply to dev + smoke test
#   manual run (Actions tab -> Run workflow) -> apply to dev or prod;
#                            prod waits for approval on the "production" environment
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TF_API_TOKEN, CURATOR_API_KEY
# Repository variables: TF_CLOUD_ORGANIZATION, WORKERS_SUBDOMAIN

name: Deploy Digital Museum

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_curator_api_key: ${{ secrets.CURATOR_API_KEY }}
  TF_VAR_workers_subdomain: ${{ vars.WORKERS_SUBDOMAIN }}

jobs:
  test:
    name: Test application and check Terraform format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax-check JavaScript
        run: node --check application/worker.js && node --check application/script.js

      - name: Run Worker unit tests
        run: npm test

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

  plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Publish plan to job summary
        run: |
          {
            echo "## Terraform plan: ${{ matrix.environment }}"
            echo '```'
            terraform show -no-color tfplan | grep -E '^\s*# |^Plan:|^No changes' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (${{ inputs.environment || 'dev' }})
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || 'development' }}
      url: ${{ steps.outputs.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color -auto-approve tfplan

      - name: Read Terraform outputs
        id: outputs
        run: |
          url=$(terraform output -raw application_url)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployed ${{ inputs.environment || 'dev' }}"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Application URL | $url |"
            echo "| Worker | $(terraform output -raw worker_name) |"
            echo "| Artifacts KV namespace | $(terraform output -raw artifacts_kv_namespace_id) |"
            echo "| Site KV namespace | $(terraform output -raw site_kv_namespace_id) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          # A new workers.dev route can take a short while to become reachable.
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "${{ steps.outputs.outputs.url }}/api/health"
          curl --fail --silent --show-error -o /dev/null "${{ steps.outputs.outputs.url }}/"
